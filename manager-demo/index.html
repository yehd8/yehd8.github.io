function overview(){const t=totals(),recent=state.entries.filter(e=>e.currency===currency&&!e.voided).sort(sortEntries).slice(0,5),expenses=state.entries.filter(e=>e.currency===currency&&e.kind==='expense'&&!e.voided).sort(sortEntries).slice(0,4);return `<div class="metric-grid">${metric('Available balance',`<span class="${t.balance<0?'amount-negative':''}">${money(t.balance)}</span>`,'wallet',`Starting balance + income − expenses`)}${metric('Total income',money(t.income),'trending',`<span class="positive">Money received</span> · ${currency}`)}${metric('Total expenses',money(t.expenses),'file',`All active expense records · ${currency}`)}${metric('Starting balance',money(t.opening),'building',`<button class="text-btn" onclick="openingForm()">Edit starting funds ${icon('chevron','sm')}</button>`)}</div><div class="overview-middle"><section class="panel chart-panel"><div class="panel-head"><div><h2>Cash flow overview</h2><p>A clear picture of money coming in and going out.</p><div class="finance-chart-key"><span><i></i>Income</span><span><i></i>Expenses</span></div></div><div class="segmented" role="group" aria-label="Chart range">${[4,8].map(n=>`<button class="${chartWeeks===n?'active':''}" onclick="setChart(${n})">${n} weeks</button>`).join('')}</div></div><div class="chart-wrap">${financeChart()}</div><div class="chart-summary"><div><span>Money received</span><b>${money(t.income)}</b></div><div><span>Money spent</span><b>${money(t.expenses)}</b></div><div><span>Net movement</span><b>${money(t.income-t.expenses)}</b></div></div></section><section class="panel"><div class="panel-head"><div><h2>Latest expenses</h2><p>The details behind your spending.</p></div><button class="text-btn" onclick="go('expenses')">View all ${icon('chevron','sm')}</button></div>${expenses.length?expenses.map(e=>`<div class="session-row"><div class="expense-symbol">${icon('file')}</div><div class="session-info"><h3>${esc(e.description)}</h3><p>${esc(e.category)} · ${shortDate(e.date)}</p></div><div class="expense-row-amount">${money(e.amount)}</div></div>`).join(''):emptyState('No expenses in '+currency,'Record an expense to see it here.',`entryForm('expense')`,'Add expense')}</section></div><section class="panel table-panel"><div class="panel-head"><div><h2>Recent transactions</h2><p>Your latest financial movements, all together.</p></div><span class="tag purple">${currency} ledger</span></div>${entryTable(recent)}</section><div class="lower-grid"><section class="panel"><div class="panel-head"><div><h2>Where your money goes</h2><p>Expenses by category, excluding voided entries.</p></div></div>${expenseBreakdown()}</section><section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>The latest changes in this preview.</p></div></div><div class="activity-list">${state.activities.slice(0,4).map(activityRow).join('')}</div></section></div>`;}
function financeChart(){const end=today(),ends=Array.from({length:chartWeeks},(_,i)=>shiftDate(end,-7*(chartWeeks-1-i))),series=kind=>ends.map(last=>state.entries.filter(e=>e.currency===currency&&e.kind===kind&&!e.voided&&e.date<=last&&e.date>shiftDate(last,-7)).reduce((n,e)=>n+e.amount,0)),income=series('income'),expenses=series('expense'),max=Math.max(1,...income,...expenses),points=rows=>rows.map((value,i)=>[60+i*495/(chartWeeks-1),151-value/max*121]),incomePoints=points(income),expensePoints=points(expenses),line=rows=>rows.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)).join(' ');return `<svg class="line-chart finance-line-chart" viewBox="0 0 590 190" role="img" aria-label="Income and expenses over ${chartWeeks} weeks in ${currency}"><defs><linearGradient id="cash-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a997ef" stop-opacity=".18"/><stop offset="1" stop-color="#a997ef" stop-opacity=".01"/></linearGradient></defs>${[0,1,2,3,4].map(i=>{const y=151-i*30.25;return `<path class="chart-grid" d="M58 ${y}H570"/><text class="chart-label finance-axis" x="2" y="${y+4}">${esc(compactMoney(max*i/4))}</text>`;}).join('')}<path d="${line(incomePoints)} L555 151 L60 151Z" fill="url(#cash-fill)"/><path d="${line(incomePoints)}" fill="none" stroke="#927be0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${line(expensePoints)}" fill="none" stroke="#d7a059" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>${ends.map((last,i)=>`${[incomePoints,expensePoints].map((p,j)=>`<circle cx="${p[i][0]}" cy="${p[i][1]}" r="3.1" fill="white" stroke="${j?'#d7a059':'#927be0'}" stroke-width="1.6"><title>${shortDate(last)} · ${j?'Expenses':'Income'}: ${money(j?expenses[i]:income[i])}</title></circle>`).join('')}<text class="chart-label" text-anchor="middle" x="${incomePoints[i][0]}" y="177">${shortDate(last)}</text>`).join('')}</svg>`;}
function setChart(value){if(![4,8].includes(value))return;chartWeeks=value;render();}
function categories(){const result={};for(const e of state.entries.filter(e=>e.currency===currency&&e.kind==='expense'&&!e.voided))result[e.category]=(result[e.category]||0)+e.amount;return Object.entries(result).sort((a,b)=>b[1]-a[1]);}
function expenseBreakdown(){const rows=categories(),sum=rows.reduce((n,r)=>n+r[1],0),colors=['#9a84e5','#c2b4f0','#e2ad6d','#7ebba6','#9db7d7','#e2a9b7'];let current=0;const gradient=rows.map((row,i)=>{const from=current;current+=row[1]/(sum||1)*100;return `${colors[i%colors.length]} ${from}% ${current}%`;}).join(',')||'#ecebf5 0% 100%';return `<div class="audience-content"><div class="donut" role="img" aria-label="Expense categories in ${currency}" style="background:conic-gradient(${gradient})"><div class="donut-hole"><b>${money(sum)}</b><span>Total expenses</span></div></div><div class="audience-legend">${rows.length?rows.map((r,i)=>`<div><i style="background:${colors[i%colors.length]}"></i><span>${esc(r[0])}</span><b>${Math.round(r[1]/sum*100)}%</b></div>`).join(''):'<p class="subtle small">No recorded expenses for this currency.</p>'}</div></div>`;}
function sortEntries(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id);}
function filteredEntries(kind=view==='income'?'income':view==='expenses'?'expense':null){return state.entries.filter(e=>e.currency===currency&&(!kind||e.kind===kind)&&(statusFilter==='all'||(statusFilter==='active'?!e.voided:e.voided))&&(categoryFilter==='all'||e.category===categoryFilter)&&(!fromDate||e.date>=fromDate)&&(!toDate||e.date<=toDate)&&[e.description,e.category,e.reference,e.note].some(value=>value.toLowerCase().includes(search.toLowerCase()))).sort(sortEntries);}
function entryTable(rows){return `<div class="table-scroll"><table class="finance-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="numeric">Amount</th><th></th></tr></thead><tbody>${rows.length?rows.map(entryRow).join(''):`<tr><td colspan="6"><div class="empty-list">${icon('file','lg')}<h3>No matching transactions</h3><p>Try another filter or add your first entry.</p></div></td></tr>`}</tbody></table></div>`;}
function entryRow(e){return `<tr class="${e.voided?'voided-row':''}"><td>${shortDate(e.date)}</td><td><div class="name-cell"><span class="avatar ${e.kind==='expense'?'expense-avatar':''}">${icon(e.kind==='expense'?'file':'wallet','sm')}</span><div><strong>${esc(e.description)}</strong><small>${esc(e.method)}${e.reference?' · '+esc(e.reference):''}</small></div></div>${e.voided?`<small class="void-reason">Voided: ${esc(e.voidReason)}</small>`:''}</td><td>${esc(e.category)}</td><td><span class="tag ${e.kind==='income'?'green':'orange'}">${e.kind==='income'?'Income':'Expense'}</span></td><td class="numeric finance-amount ${e.kind==='income'?'income-amount':'expense-amount'}">${e.kind==='expense'?'−':'+'}${money(e.amount)}</td><td><div class="row-actions">${e.voided?'<span class="tag">Voided</span>':`<button class="icon-btn ghost" aria-label="Edit ${esc(e.description)}" onclick="entryForm('${e.kind}','${e.id}')">${icon('edit','sm')}</button><button class="icon-btn ghost danger" aria-label="Void ${esc(e.description)}" onclick="voidForm('${e.id}')">${icon('close','sm')}</button>`}</div></td></tr>`;}
function ledger(kind){const relevant=state.entries.filter(e=>e.currency===currency&&e.kind===kind&&!e.voided),sum=relevant.reduce((n,e)=>n+e.amount,0),count=filteredEntries(kind).length;return `<div class="payments-top">${metric(kind==='income'?'Total money received':'Total expenses',money(sum),kind==='income'?'wallet':'file',`All active ${kind==='income'?'income':'expense'} entries · ${currency}`)}${metric('Recorded entries',relevant.length,'grid','Voided entries are excluded')}${metric('Available balance',money(totals().balance),'building','Calculated from the full active ledger')}</div><section class="panel table-panel"><div class="panel-head"><div><h2>${kind==='income'?'Income records':'Expense records'}</h2><p>Search, review, and keep each record clear.</p></div><span class="tag purple">${currency}</span></div><div class="finance-controls"><label class="search-box">${icon('search','sm')}<input aria-label="Search financial entries" maxlength="180" placeholder="Search description or reference…" value="${esc(search)}" oninput="setSearch(this.value)"></label><label>Category<select aria-label="Filter category" onchange="setCategory(this.value)"><option value="all">All categories</option>${[...new Set(state.entries.filter(e=>e.currency===currency&&e.kind===kind).map(e=>e.category))].sort().map(value=>`<option value="${esc(value)}" ${value===categoryFilter?'selected':''}>${esc(value)}</option>`).join('')}</select></label><label>From<input type="date" aria-label="From date" max="${today()}" value="${fromDate}" onchange="setDateFilter('from',this.value)"></label><label>To<input type="date" aria-label="To date" max="${today()}" value="${toDate}" onchange="setDateFilter('to',this.value)"></label><label>Status<select aria-label="Filter entry status" onchange="setStatusFilter(this.value)">${[['active','Active'],['all','All entries'],['voided','Voided']].map(([value,label])=>`<option value="${value}" ${value===statusFilter?'selected':''}>${label}</option>`).join('')}</select></label></div><div id="ledger-table">${entryTable(filteredEntries(kind).slice((page-1)*10,page*10))}</div><div class="table-footer"><span id="ledger-count">${count} matching entr${count===1?'y':'ies'}</span><div class="finance-pager" id="ledger-pagination">${pagination(count)}</div></div></section>`;}
function pagination(count){return `<button ${page<=1?'disabled':''} onclick="changePage(-1)">${icon('left','sm')}Previous</button><span>Page ${page} of ${Math.max(1,Math.ceil(count/10))}</span><button ${page*10>=count?'disabled':''} onclick="changePage(1)">Next${icon('chevron','sm')}</button>`;}
function updateTable(){const rows=filteredEntries();document.querySelector('#ledger-table').innerHTML=entryTable(rows.slice((page-1)*10,page*10));document.querySelector('#ledger-count').textContent=rows.length+' matching entr'+(rows.length===1?'y':'ies');document.querySelector('#ledger-pagination').innerHTML=pagination(rows.length);}
function setSearch(value){search=String(value).slice(0,180);page=1;updateTable();}
function setCategory(value){categoryFilter=value;page=1;render();}
function setStatusFilter(value){if(!['active','all','voided'].includes(value))return;statusFilter=value;page=1;render();}
function changePage(step){const target=page+step;if(target<1||target>Math.max(1,Math.ceil(filteredEntries().length/10)))return;page=target;updateTable();}
function setDateFilter(kind,value){if(value&&!validDate(value)){toast('Choose a valid date, today or earlier.','info');render();return;}const from=kind==='from'?value:fromDate,to=kind==='to'?value:toDate;if(from&&to&&from>to){toast('The start date must be before the end date.','info');render();return;}fromDate=from;toDate=to;page=1;render();}
function emptyState(title,copy,action,label){return `<div class="empty-list">${icon('file','lg')}<h3>${esc(title)}</h3><p>${esc(copy)}</p>${action?`<button class="primary" onclick="${action}">${icon('plus','sm')}${label}</button>`:''}</div>`;}
function balancesPage(){return `<div class="inline-note">${icon('info')}<span>Each currency has its own balance. Figures use starting funds plus income, minus active expenses. No currency conversion is applied.</span></div><div class="balance-grid">${CURRENCIES.map(code=>{const t=totals(code);return `<section class="panel balance-card"><div class="balance-heading"><span class="balance-icon">${icon('building','lg')}</span><span class="tag purple">${code}</span></div><p>Available balance</p><strong class="balance-value ${t.balance<0?'amount-negative':''}">${money(t.balance,code)}</strong><div class="balance-lines"><div><span>Starting balance</span><b>${money(t.opening,code)}</b></div><div><span>Income</span><b class="income-amount">+${money(t.income,code)}</b></div><div><span>Expenses</span><b class="expense-amount">−${money(t.expenses,code)}</b></div></div><button onclick="openingForm('${code}')">${icon('edit','sm')}Edit starting balance</button></section>`;}).join('')}</div>`;}
function monthRows(){const start=new Date(today()+'T12:00:00Z');return Array.from({length:6},(_,i)=>{const d=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()-i,1,12)),key=d.toISOString().slice(0,7),rows=state.entries.filter(e=>e.currency===currency&&!e.voided&&e.date.startsWith(key)),income=rows.filter(e=>e.kind==='income').reduce((n,e)=>n+e.amount,0),expenses=rows.filter(e=>e.kind==='expense').reduce((n,e)=>n+e.amount,0);return {label:d.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}),income,expenses,net:income-expenses};});}
function reportsPage(){const t=totals();return `<div class="metric-grid">${metric('Available funds',money(t.balance),'wallet','Across the full active ledger')}${metric('Total income',money(t.income),'trending','Active income entries only')}${metric('Total expenses',money(t.expenses),'file','Active expense entries only')}${metric('Net movement',money(t.income-t.expenses),'chart','Income minus expenses')}</div><div class="overview-middle"><section class="panel table-panel"><div class="panel-head"><div><h2>Monthly financial summary</h2><p>The last six months, in ${currency}.</p></div></div><div class="table-scroll"><table><thead><tr><th>Month</th><th class="numeric">Income</th><th class="numeric">Expenses</th><th class="numeric">Net movement</th></tr></thead><tbody>${monthRows().map(row=>`<tr><td>${row.label}</td><td class="numeric income-amount">${money(row.income)}</td><td class="numeric expense-amount">${money(row.expenses)}</td><td class="numeric">${money(row.net)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Expense breakdown</h2><p>Every category in the selected currency.</p></div></div>${expenseBreakdown()}</section></div>`;}
function settingsPage(){return `<div class="settings-grid"><section class="panel"><div class="panel-head"><div><h2>Workspace preferences</h2><p>Keep the finance workspace comfortable to use.</p></div></div><div class="settings-body"><label class="field"><span>Default currency</span><select aria-label="Default currency" onchange="saveDefaultCurrency(this.value)">${CURRENCIES.map(code=>`<option ${code===state.settings.defaultCurrency?'selected':''}>${code}</option>`).join('')}</select></label><div class="settings-row"><div><strong>Presentation mode</strong><p>A clean view for showing the dashboard.</p></div><button onclick="presentation()">${icon('monitor','sm')}${isPresentation?'Exit':'Enter'}</button></div></div></section><section class="panel"><div class="panel-head"><div><h2>About this review</h2><p>A preview to review before packaging the app.</p></div></div><div class="settings-body review-copy"><span class="tag purple">Browser preview</span><h3>Sample figures. Your preferred layout.</h3><p>Try adding income, recording expenses, changing a starting balance, or exporting a report. This is a public presentation demo with sample data; changes are saved only in this browser.</p><p>The installed business manager will use its local database. This preview is not connected to PPC’s financial records.</p><button onclick="resetPrompt()">${icon('refresh','sm')}Reset sample data</button></div></section></div>`;}
function saveDefaultCurrency(value){if(!CURRENCIES.includes(value))return;const previous=currency;currency=value;if(!commit(()=>{state.settings.defaultCurrency=value;activity('Default currency changed to '+value,'settings');},'Preference saved'))currency=previous;}
function entryForm(kind,id=null){if(!['income','expense'].includes(kind))return;const existing=id?state.entries.find(e=>e.id===id):null;if(id&&(!existing||existing.voided)){toast('That entry cannot be edited.','info');return;}const token=existing?.id||crypto.randomUUID(),suggestions=kind==='income'?['Donations','Grants','Contributions','Services','Other income']:['Programmes','Salaries','Rent','Travel','Supplies','Utilities','Other expenses'];openModal(existing?'Edit '+kind:'Add '+kind,kind==='income'?'Record the money received and keep its details together.':'Record an expense so the available balance stays current.',`<form id="entry-form" onsubmit="submitEntry(event,'${kind}')"><input type="hidden" name="id" value="${token}"><input type="hidden" name="editing" value="${existing?'yes':'no'}"><div class="form-grid"><label class="field full-width"><span>Description *</span><input name="description" required maxlength="180" value="${esc(existing?.description||'')}" placeholder="${kind==='income'?'For example, donation received':'For example, office supplies'}"></label><label class="field"><span>Amount *</span><input name="amount" type="text" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" required maxlength="15" value="${existing?amountText(existing.amount):''}" placeholder="0.00"></label><label class="field"><span>Currency *</span><select name="currency">${CURRENCIES.map(code=>`<option ${code===(existing?.currency||currency)?'selected':''}>${code}</option>`).join('')}</select></label><label class="field"><span>Date *</span><input name="date" type="date" min="1900-01-01" max="${today()}" required value="${existing?.date||today()}"></label><label class="field"><span>Category *</span><input name="category" required maxlength="80" list="category-options" value="${esc(existing?.category||'')}" placeholder="Choose or type a category"><datalist id="category-options">${suggestions.map(value=>`<option value="${value}">`).join('')}</datalist></label><label class="field"><span>Payment method</span><select name="method">${['Cash','Bank transfer','Other'].map(value=>`<option ${value===(existing?.method||'Cash')?'selected':''}>${value}</option>`).join('')}</select></label><label class="field"><span>Reference</span><input name="reference" maxlength="120" value="${esc(existing?.reference||'')}" placeholder="Receipt or transfer reference"></label><label class="field full-width"><span>Internal notes</span><textarea name="note" rows="3" maxlength="1500">${esc(existing?.note||'')}</textarea></label></div><div class="inline-note form-note">${icon('info')}<span>Use a dot for decimals. Saving updates the sample balance in the selected currency.</span></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="entry-form">${icon('check','sm')}Save ${kind}</button>`);}
function submitEntry(event,kind){event.preventDefault();if(!['income','expense'].includes(kind))return;const form=event.target,d=Object.fromEntries(new FormData(form)),amount=amountMinor(d.amount),existing=state.entries.find(e=>e.id===d.id);if(amount===null||amount<=0||!CURRENCIES.includes(d.currency)||!validDate(d.date)||!String(d.description||'').trim()||String(d.description).trim().length>180||!String(d.category||'').trim()||String(d.category).trim().length>80||!['Cash','Bank transfer','Other'].includes(d.method)||String(d.reference||'').length>120||String(d.note||'').length>1500||!/^[a-zA-Z0-9-]{1,80}$/.test(d.id)){toast('Check the required details and use a positive amount with up to two decimal places.','info');return;}if(existing&&d.editing!=='yes'){closeModal();toast('This entry is already saved.');return;}if(d.editing==='yes'&&(!existing||existing.voided)){toast('This entry can no longer be edited.','info');return;}const previousCurrency=currency;currency=d.currency;const record={id:d.id,kind,amount,currency:d.currency,date:d.date,description:d.description.trim(),category:d.category.trim(),method:d.method,reference:d.reference.trim(),note:d.note.trim(),voided:false,voidReason:''};if(!commit(()=>{if(existing)Object.assign(existing,record);else state.entries.push(record);activity((existing?'Updated ':'Recorded ')+kind+': '+record.description,kind==='income'?'wallet':'file');},`${kind==='income'?'Income':'Expense'} saved. Balance updated.`))currency=previousCurrency;}
function openingForm(code=currency){if(!CURRENCIES.includes(code))return;openModal('Set starting balance',`Enter the funds available before the income and expenses recorded in ${code}.`,`<form id="opening-form" onsubmit="submitOpening(event,'${code}')"><div class="form-grid"><label class="field full-width"><span>Starting balance (${code}) *</span><input name="amount" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" required maxlength="15" value="${amountText(state.opening[code]||0)}"></label></div><div class="inline-note form-note">${icon('info')}<span>Changing starting funds updates the recorded balance. It does not send or receive money.</span></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" form="opening-form" type="submit">${icon('check','sm')}Save starting balance</button>`);}
function submitOpening(event,code){event.preventDefault();const value=amountMinor(new FormData(event.target).get('amount'));if(value===null||!CURRENCIES.includes(code)){toast('Enter a valid amount with up to two decimal places.','info');return;}commit(()=>{state.opening[code]=value;activity('Starting balance updated for '+code,'building');},'Starting balance saved.');}
function voidForm(id){const entry=state.entries.find(e=>e.id===id);if(!entry||entry.voided)return;openModal('Void this entry?',`${esc(entry.description)} · ${money(entry.amount,entry.currency)}`,`<form id="void-form" onsubmit="submitVoid(event,'${id}')"><p class="subtle">This entry will be excluded from the balance and kept in the history.</p><label class="field void-field"><span>Reason *</span><textarea name="reason" required minlength="3" maxlength="500" rows="3" placeholder="Why should this entry be voided?"></textarea></label></form>`,`<button onclick="closeModal()">Keep entry</button><button class="danger" type="submit" form="void-form">Void entry</button>`);}
function submitVoid(event,id){event.preventDefault();const entry=state.entries.find(e=>e.id===id),reason=String(new FormData(event.target).get('reason')||'').trim();if(!entry||entry.voided||reason.length<3||reason.length>500){toast('Add a short reason for voiding the entry.','info');return;}commit(()=>{entry.voided=true;entry.voidReason=reason;activity('Voided '+entry.kind+': '+entry.description,'file');},'Entry voided. Balance updated.');}

function toast(text,ic='check'){const t=document.createElement('div');t.className='toast';t.innerHTML=icon(ic)+`<span>${esc(text)}</span>`;document.querySelector('#toasts').append(t);setTimeout(()=>t.remove(),4300)}

function activityRow(a){return `<div class="activity"><div class="activity-dot">${icon(a.icon)}</div><div><p>${esc(a.text)}</p><small>${esc(a.time)}</small></div></div>`}

function partnersPage(){return `<section class="panel table-panel"><div class="panel-head"><div><h2>Partner directory</h2><p>Sample contacts for institutions and donor relationships.</p></div><span class="tag purple">${state.partners.length} partners</span></div><div class="table-scroll"><table><thead><tr><th>Organization</th><th>Type</th><th>Contact person</th><th>Relationship</th><th></th></tr></thead><tbody>${state.partners.map(p=>`<tr><td><div class="name-cell"><span class="avatar">${icon('building','sm')}</span><div><strong>${esc(p.name)}</strong><small>${esc(p.email)}</small></div></div></td><td><span class="tag ${p.type==='Donor'?'orange':'purple'}">${esc(p.type)}</span></td><td>${esc(p.contact)}</td><td>${esc(p.notes)}</td><td><button class="icon-btn ghost" aria-label="Edit ${esc(p.name)}" onclick="partnerForm('${p.id}')">${icon('edit','sm')}</button></td></tr>`).join('')}</tbody></table></div></section>`}

function openModal(title,subtitle,body,footer='',wide=false){lastFocus=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle" class="modal ${wide?'wide':''}"><header class="modal-head"><div><h2 id="modal-title">${title}</h2><p id="modal-subtitle">${subtitle}</p></div><button class="icon-btn" aria-label="Close dialog" onclick="closeModal()">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal select,.modal button')?.focus(),0)}

function closeModal(){document.querySelector('#modal-root').innerHTML='';document.body.style.overflow='';lastFocus?.isConnected&&lastFocus.focus()}

function presentation(){isPresentation=!isPresentation;document.body.classList.toggle('presentation',isPresentation);closeModal();render();window.scrollTo(0,0)}

function partnerForm(id=null){
 const p=id?state.partners.find(p=>p.id===id):null;
 if(id&&!p)return;
 const token=p?.id||crypto.randomUUID();
 openModal(p?'Edit partner':'Add a partner','Keep institution and donor contact details together.',`<form id="partner-form" onsubmit="submitPartner(event)"><input type="hidden" name="id" value="${token}"><input type="hidden" name="editing" value="${p?'yes':'no'}"><div class="form-grid"><label class="field full-width"><span>Organization name *</span><input name="name" required maxlength="100" value="${esc(p?.name||'')}"></label><label class="field"><span>Type</span><select name="type"><option ${p?.type==='Institution'?'selected':''}>Institution</option><option ${p?.type==='Donor'?'selected':''}>Donor</option></select></label><label class="field"><span>Contact person *</span><input name="contact" required maxlength="80" value="${esc(p?.contact||'')}"></label><label class="field full-width"><span>Email *</span><input type="email" name="email" required maxlength="120" value="${esc(p?.email||'')}"></label><label class="field full-width"><span>Relationship notes</span><textarea name="notes" maxlength="300">${esc(p?.notes||'')}</textarea></label></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="partner-form">Save partner</button>`);
}
function submitPartner(event){
 event.preventDefault();
 const d=Object.fromEntries(new FormData(event.target)),existing=state.partners.find(p=>p.id===d.id);
 if(!/^[a-zA-Z0-9-]{1,80}$/.test(d.id)||!d.name.trim()||d.name.trim().length>100||!d.contact.trim()||d.contact.trim().length>80||!['Donor','Institution'].includes(d.type)||!event.target.elements.email.validity.valid||!d.email.trim()||d.email.length>120||d.notes.length>300){toast('Check the required contact details.','info');return;}
 if(existing&&d.editing!=='yes'){closeModal();toast('This partner is already saved.');return;}
 if(d.editing==='yes'&&!existing){toast('This partner is no longer available.','info');return;}
 const record={id:d.id,name:d.name.trim(),type:d.type,contact:d.contact.trim(),email:d.email.trim(),notes:d.notes.trim(),status:'Active'};
 commit(()=>{if(existing)Object.assign(existing,record);else state.partners.push(record);activity((existing?'Updated partner: ':'Added partner: ')+record.name,'users');},'Partner saved');
}
function notifications(){openModal('Recent activity','The latest changes in your demo workspace.',`<div class="activity-list" style="padding:0">${state.activities.map(activityRow).join('')}</div>`,`<button onclick="closeModal()">Close</button>`);}
function resetPrompt(){openModal('Reset this preview?','Return to the sample figures for your next review.',`<p class="subtle small">Income, expenses, starting balances, contacts, and preferences entered in this finance preview will be replaced by the sample data.</p>`,`<button onclick="closeModal()">Keep my changes</button><button class="primary" onclick="resetDemo()">${icon('refresh','sm')}Reset sample data</button>`);}
function resetDemo(){
 const previousView=view,previousCurrency=currency;
 view='overview';currency='USD';
 if(!commit(()=>{state=seed();},'Sample data restored')){view=previousView;currency=previousCurrency;return;}
 search='';statusFilter='active';categoryFilter='all';fromDate='';toDate='';page=1;render();
}
function csvText(headers,rows){
 const safe=value=>{let cell=String(value??'');if(/^\s*[=+@-]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"';};
 return '\uFEFF'+[headers,...rows].map(row=>row.map(safe).join(',')).join('\r\n');
}
function csvFile(name,headers,rows){
 const blob=new Blob([csvText(headers,rows)],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV export downloaded');
}
function exportEntries(){csvFile(`${view==='income'?'income':'expenses'}-${currency.toLowerCase()}-review.csv`,['Date','Type','Description','Category','Amount','Currency','Payment method','Reference','Status','Internal notes','Void reason'],filteredEntries().map(e=>[e.date,e.kind,e.description,e.category,amountText(e.amount),e.currency,e.method,e.reference,e.voided?'Voided':'Active',e.note,e.voidReason||'']));}
function exportReport(){csvFile(`finance-report-${currency.toLowerCase()}-review.csv`,['Month','Income','Expenses','Net movement','Currency'],monthRows().map(row=>[row.label,amountText(row.income),amountText(row.expenses),amountText(row.net),currency]));}

document.addEventListener('keydown',event=>{
 const modal=document.querySelector('.modal');
 if(event.key==='Escape'){if(modal)closeModal();else if(isPresentation)presentation();else document.body.classList.remove('nav-open');}
 if(event.key!=='Tab'||!modal)return;
 const controls=[...modal.querySelectorAll('button:not([disabled]),input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')],first=controls[0],last=controls.at(-1);
 if(!first)return;
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
 else if(!event.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){event.preventDefault();first.focus();}
});
render();
