function audience(){const cats=['Individual','Institution','Donor'],counts=cats.map(t=>state.registrations.filter(r=>r.type===t&&r.status!=='cancelled').length),n=counts.reduce((a,b)=>a+b,0);const a=n?counts[0]/n*100:0,b=n?(counts[0]+counts[1])/n*100:0;return `<div class="audience-content"><div class="donut" role="img" aria-label="${counts.map((c,i)=>c+' '+cats[i]+' bookings').join(', ')}" style="background:conic-gradient(var(--purple) 0 ${a}%,#aea0ea ${a}% ${b}%,#e4def8 ${b}% 100%)"><div>${n}<small>registrations</small></div></div><div class="legend">${cats.map((t,i)=>`<div class="legend-row"><span><i style="background:${['#6c58d9','#aea0ea','#e4def8'][i]}"></i>${t==='Individual'?'Individuals':t==='Institution'?'Institutions':'Donors'}</span><b>${counts[i]} <span class="subtle">· ${n?Math.round(counts[i]/n*100):0}%</span></b></div>`).join('')}</div></div>`}
function registrationTabs(){return `<div class="tabs" role="group" aria-label="Filter registration status">${[['all','All registrations'],['paid','Paid'],['review','To review'],['unpaid','Unpaid']].map(([id,label])=>`<button class="tab ${filter===id?'active':''}" onclick="setFilter('${id}')">${label}<span>${state.registrations.filter(r=>id==='all'||r.status===id).length}</span></button>`).join('')}</div>`}
function filteredRegs(){return state.registrations.filter(r=>(filter==='all'||r.status===filter)&&(typeFilter==='all'||r.type===typeFilter)&&(courseFilter==='all'||r.courseId===courseFilter)&&[r.id,r.name,r.email,r.organization,course(r.courseId)?.title].join(' ').toLowerCase().includes(search.toLowerCase()))}
function registrationTable(compact=false){const all=filteredRegs(),limit=compact?5:10,start=(page-1)*limit,rows=all.slice(start,start+limit);return `<div class="table-scroll"><table><thead><tr><th>Participant</th><th>Course</th><th>Type</th><th>Amount</th><th>Payment</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><div class="name-cell"><div class="avatar c${i%4}">${esc(r.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</div><div><strong>${esc(r.name)}</strong><small>${esc(r.id)} · ${shortDate(r.created)}</small></div></div></td><td class="course-cell">${esc(course(r.courseId)?.title||'Archived course')}<small>${r.seats} ${r.seats===1?'seat':'seats'} · ${course(r.courseId)?.mode||''}</small></td><td><span class="tag ${r.type==='Institution'?'purple':r.type==='Donor'?'orange':''}">${esc(r.type)}</span></td><td class="amount">${money(total(r))}</td><td>${statusTag(r.status)}</td><td><button class="icon-btn ghost" aria-label="View registration ${esc(r.id)} for ${esc(r.name)}" onclick="registrationDetails('${r.id}')">${icon('chevron','sm')}</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">${icon('search')}<h3>No matching registrations</h3><p>Try another name, course or filter.</p><button onclick="clearFilters()">Clear filters</button></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>${all.length?`Showing ${start+1}–${Math.min(start+limit,all.length)} of ${all.length} registrations`:'0 registrations'}</span><div class="pagination"><button ${page===1?'disabled':''} aria-label="Previous page" onclick="changePage(-1)">‹</button><button class="current" aria-label="Current page ${page}">${page}</button><button ${start+limit>=all.length?'disabled':''} aria-label="Next page" onclick="changePage(1)">›</button></div></div>`}
function registrations(){return `<div class="toolbar"><label class="search-box">${icon('search','sm')}<input id="reg-search" aria-label="Search registrations" placeholder="Search by name, course or reference..." value="${esc(search)}" oninput="setSearch(this.value)"></label><select class="filter-select" aria-label="Filter audience type" onchange="typeFilter=this.value;page=1;updateTable()"><option value="all">All audience types</option>${['Individual','Institution','Donor'].map(t=>`<option ${typeFilter===t?'selected':''}>${t}</option>`).join('')}</select><select class="filter-select" aria-label="Filter course" onchange="courseFilter=this.value;page=1;updateTable()"><option value="all">All courses</option>${state.courses.map(c=>`<option value="${c.id}" ${courseFilter===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><section class="panel table-panel"><div class="panel-head">${registrationTabs()}<span class="subtle small">${state.registrations.length} bookings</span></div><div id="reg-table">${registrationTable()}</div></section>`}
function setSearch(v){search=v;page=1;updateTable()}
function setFilter(v){filter=v;page=1;render()}
function clearFilters(){search='';filter='all';typeFilter='all';courseFilter='all';page=1;render()}
function changePage(n){page+=n;updateTable()}
function updateTable(){const el=document.querySelector('#reg-table');if(el)el.innerHTML=registrationTable(view==='overview')}
function coursesPage(){return `<div class="toolbar"><span class="subtle small">${state.courses.length} courses · ${state.courses.filter(c=>c.published).length} published</span><div style="margin-left:auto"><span class="tag purple">${state.courses.filter(c=>c.mode==='Online').length} online</span> <span class="tag">${state.courses.filter(c=>c.mode==='In person').length} in person</span></div></div><div class="course-grid">${state.courses.map((c,i)=>`<article class="course-card"><div class="course-art art${i%4}"><span>${esc(c.category)}</span>${icon(c.icon||'book')}</div><div class="course-body"><div class="course-meta"><span class="tag ${c.published?'green':''}">${c.published?'Published':'Draft'}</span><span class="small subtle">${esc(c.mode)}</span></div><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p><div class="course-detail">${icon('calendar')}${date(c.date)} · ${c.time}</div><div class="course-detail">${icon('clock')}${esc(c.duration)} · ${esc(c.location)}</div><div class="course-seats">${booked(c.id)} of ${c.capacity} seats reserved<div class="progress-track"><span style="width:${Math.min(100,booked(c.id)/c.capacity*100)}%"></span></div></div><div class="course-bottom"><div class="course-price">${money(c.price)}<small>per participant</small></div><button onclick="courseDetails('${c.id}')">Manage course ${icon('chevron','sm')}</button></div></div></article>`).join('')}</div>`}
function calendarPage(){const first=new Date(calendarYear,calendarMonth,1),start=new Date(calendarYear,calendarMonth,1-((first.getDay()+6)%7));const monthTitle=first.toLocaleDateString('en',{month:'long',year:'numeric'});let cells='';for(let i=0;i<Math.ceil((((first.getDay()+6)%7)+new Date(calendarYear,calendarMonth+1,0).getDate())/7)*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');cells+=`<div class="calendar-day ${d.getMonth()!==calendarMonth?'outside':''} ${iso==='2026-10-24'?'today':''}"><span>${d.getDate()}</span>${state.courses.filter(c=>c.date===iso).map(c=>`<button class="calendar-event" onclick="courseDetails('${c.id}')">${esc(c.title)}<small>${c.time} · ${esc(c.mode)}</small></button>`).join('')}</div>`}return `<section class="panel"><div class="panel-head"><div><h2>${monthTitle}</h2><p>All training sessions, including drafts.</p></div><div style="display:flex;gap:7px"><button class="icon-btn" aria-label="Previous month" onclick="moveMonth(-1)">‹</button><button onclick="calendarMonth=9;calendarYear=2026;render()">Today</button><button class="icon-btn" aria-label="Next month" onclick="moveMonth(1)">›</button></div></div><div class="calendar-grid">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div class="calendar-day-title">${d}</div>`).join('')}${cells}</div><div class="calendar-agenda">${state.courses.filter(c=>new Date(c.date+'T12:00:00').getMonth()===calendarMonth&&new Date(c.date+'T12:00:00').getFullYear()===calendarYear).sort((a,b)=>a.date.localeCompare(b.date)).map(sessionRow).join('')||'<div class="empty">No sessions this month.</div>'}</div></section>`}
function moveMonth(n){calendarMonth+=n;if(calendarMonth<0){calendarMonth=11;calendarYear--}if(calendarMonth>11){calendarMonth=0;calendarYear++}render()}
function payments(){const rows=state.registrations.filter(r=>r.status!=='cancelled');return `<div class="payments-top">${metric('Confirmed payments',money(rows.filter(r=>r.status==='paid').reduce((s,r)=>s+total(r),0)),'wallet',`${rows.filter(r=>r.status==='paid').length} payments received`)}${metric('Under review',money(rows.filter(r=>r.status==='review').reduce((s,r)=>s+total(r),0)),'file',`${rows.filter(r=>r.status==='review').length} receipts to verify`)}${metric('Awaiting payment',money(rows.filter(r=>r.status==='unpaid').reduce((s,r)=>s+total(r),0)),'clock',`${rows.filter(r=>r.status==='unpaid').length} outstanding bookings`)}</div><div class="inline-note">${icon('info')}<span>Demo payment flow: open a receipt, review a sample bank transfer, or preview the payment page a participant sees after booking. No real money is processed.</span></div><section class="panel table-panel"><div class="panel-head"><div><h2>Payment activity</h2><p>Bank transfers and course fees.</p></div><select class="filter-select" aria-label="Filter payments" onchange="filter=this.value;document.querySelector('#payment-body').innerHTML=paymentRows()"><option value="all">All payments</option><option value="review" ${filter==='review'?'selected':''}>Under review</option><option value="paid" ${filter==='paid'?'selected':''}>Paid</option><option value="unpaid" ${filter==='unpaid'?'selected':''}>Unpaid</option></select></div><div class="table-scroll"><table><thead><tr><th>Payment reference</th><th>Participant</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="payment-body">${paymentRows()}</tbody></table></div></section>`}
function paymentRows(){return state.registrations.filter(r=>r.status!=='cancelled'&&(filter==='all'||r.status===filter)).sort((a,b)=>(a.status==='review'?-1:0)-(b.status==='review'?-1:0)).map(r=>`<tr><td><div class="receipt-row"><div class="receipt-icon">${icon('file','sm')}</div><div><strong style="font-size:10px;font-weight:550">PAY-${r.id.slice(4)}</strong><small style="display:block;font-size:8px;color:var(--muted)">${r.receipt?'Bank transfer receipt':'Payment not submitted'}</small></div></div></td><td><strong style="font-size:10px;font-weight:550">${esc(r.name)}</strong><small style="display:block;font-size:8px;color:var(--muted)">${esc(course(r.courseId)?.title)}</small></td><td class="amount">${money(total(r))}</td><td>${statusTag(r.status)}</td><td><div class="pay-actions">${r.status==='review'?`<button class="primary" onclick="reviewPayment('${r.id}')">Review receipt</button>`:r.status==='paid'?`<button onclick="reviewPayment('${r.id}')">View receipt</button>`:`<button onclick="paymentPreview('${r.id}')">${icon('link','sm')}Payment page</button>`}</div></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No payments in this category.</div></td></tr>'}
function photosPage(){return `<div class="panel gallery-summary"><div><h2>${state.photos.length} ${state.photos.length===1?'photo':'photos'} · ${state.photos.filter(p=>p.published).length} published</h2><p>Upload a photo and publish it to the sample website gallery.</p></div><button onclick="websitePreview('gallery')">${icon('eye','sm')}View website</button></div><div class="gallery-grid">${state.photos.map(p=>`<article class="photo-card"><img src="${p.url}" alt="${esc(p.title)}"><div class="photo-info"><h3>${esc(p.title)}</h3><p>${esc(p.category)}</p><div class="photo-actions"><span class="tag ${p.published?'green':''}">${p.published?'Published':'Draft'}</span><button onclick="togglePhoto('${p.id}')">${p.published?'Unpublish':'Publish'}</button><button class="icon-btn ghost danger" aria-label="Delete photo ${esc(p.title)}" onclick="deletePhoto('${p.id}')">${icon('trash','sm')}</button></div></div></article>`).join('')}<button class="upload-tile" onclick="uploadForm()">${icon('upload')}<strong>${state.photos.length?'Add another photo':'Add your first photo'}</strong><p>Choose a workshop, event or team photo.<br>JPG, PNG or WebP · up to 8 MB</p></button></div>${!state.photos.length?`<div class="inline-note" style="margin-top:22px">${icon('image')}<span>Your own photos belong here. Upload one to demonstrate how it appears in the website preview, then unpublish or remove it whenever you like.</span></div>`:''}`}
function portfolioPage(){return `<div class="inline-note">${icon('info')}<span>These sample projects demonstrate the portfolio layout. Edit a project or publish a draft, then open Website preview to see the result.</span></div><div class="portfolio-list">${state.projects.map((p,i)=>`<article class="panel project-card"><div class="project-top"><div class="project-symbol">${icon(['award','monitor','building'][i%3])}</div><span class="tag ${p.published?'green':''}">${p.published?'Published':'Draft'}</span></div><span class="small subtle">${esc(p.category)} · ${esc(p.year)}</span><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p><footer><span>Sample project</span><button onclick="projectForm('${p.id}')">${icon('edit','sm')}Edit project</button></footer></article>`).join('')}</div>`}
function partnersPage(){return `<section class="panel table-panel"><div class="panel-head"><div><h2>Partner directory</h2><p>Sample contacts for institutions and donor relationships.</p></div><span class="tag purple">${state.partners.length} partners</span></div><div class="table-scroll"><table><thead><tr><th>Organization</th><th>Type</th><th>Contact person</th><th>Relationship</th><th></th></tr></thead><tbody>${state.partners.map(p=>`<tr><td><div class="name-cell"><span class="avatar">${icon('building','sm')}</span><div><strong>${esc(p.name)}</strong><small>${esc(p.email)}</small></div></div></td><td><span class="tag ${p.type==='Donor'?'orange':'purple'}">${esc(p.type)}</span></td><td>${esc(p.contact)}</td><td>${esc(p.notes)}</td><td><button class="icon-btn ghost" aria-label="Edit ${esc(p.name)}" onclick="partnerForm('${p.id}')">${icon('edit','sm')}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function reports(){const rows=state.registrations.filter(r=>r.status!=='cancelled'),paid=rows.filter(r=>r.status==='paid'),seats=rows.reduce((s,r)=>s+Number(r.seats),0),max=Math.max(1,...state.courses.map(c=>booked(c.id)));return `<div class="metric-grid">${metric('Total bookings',rows.length,'users',`${seats} training seats reserved`)}${metric('Revenue collected',money(paid.reduce((s,r)=>s+total(r),0)),'wallet','Confirmed payments only')}${metric('Payment completion',`${rows.length?Math.round(paid.length/rows.length*100):0}%`,'chart',`${paid.length} of ${rows.length} bookings paid`)}${metric('Seat occupancy',`${Math.round(seats/Math.max(1,state.courses.reduce((s,c)=>s+Number(c.capacity),0))*100)}%`,'book','Across the full course catalog')}</div><div class="report-grid"><section class="panel"><div class="panel-head"><div><h2>Seats by course</h2><p>Which sessions are bringing people together.</p></div></div><div class="bar-chart">${state.courses.map(c=>`<div class="bar-row"><header><span>${esc(c.title)}</span><strong>${booked(c.id)} seats</strong></header><div class="bar-track"><span style="width:${booked(c.id)/max*100}%"></span></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Audience breakdown</h2><p>Based on active registrations.</p></div></div>${audience()}<div class="settings-body"><div class="settings-row"><div><strong>Online training</strong><p>Seats reserved for online courses</p></div><b>${rows.filter(r=>course(r.courseId)?.mode==='Online').reduce((s,r)=>s+Number(r.seats),0)}</b></div><div class="settings-row"><div><strong>In-person training</strong><p>Seats reserved for physical sessions</p></div><b>${rows.filter(r=>course(r.courseId)?.mode==='In person').reduce((s,r)=>s+Number(r.seats),0)}</b></div></div></section></div>`}
function settingsPage(){return `<div class="settings-grid"><section class="panel"><div class="panel-head"><div><h2>Website preferences</h2><p>These controls update the sample website preview.</p></div></div><div class="settings-body">${[['showPrices','Display course prices','Show training fees on course cards.'],['openBookings','Accept registrations','Allow new registrations in the website preview.']].map(([key,title,desc])=>`<div class="settings-row"><div><strong>${title}</strong><p>${desc}</p></div><label class="switch"><input aria-label="${title}" type="checkbox" ${state.settings[key]?'checked':''} onchange="state.settings.${key}=this.checked;save();toast('Website preference updated')"><span></span></label></div>`).join('')}<div class="settings-row"><div><strong>Website preview</strong><p>Explore the participant’s booking experience.</p></div><button onclick="websitePreview()">Open preview ${icon('external','sm')}</button></div><div class="settings-row"><div><strong>Presentation mode</strong><p>Focus on the dashboard while presenting.</p></div><button onclick="presentation()">${icon('monitor','sm')}Launch</button></div></div></section><section class="panel"><div class="panel-head"><div><h2>Team permissions</h2><p>Illustrative access levels for the finished system.</p></div><span class="tag">Preview</span></div><div class="table-scroll"><table class="permission-grid"><thead><tr><th>Permission</th><th>Admin</th><th>Staff</th><th>Editor</th></tr></thead><tbody>${[['Registrations',1,1,0],['Payment approval',1,0,0],['Courses',1,1,0],['Photos & portfolio',1,0,1],['Workspace settings',1,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="${v?'permission-yes':'subtle'}">${v?icon('check','sm'):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small subtle" style="padding:4px 20px 15px;font-size:10px">Permissions here are illustrative. This demo has no live accounts or sign-in.</p></section></div><div class="inline-note" style="margin-top:22px">${icon('info')}<span>This demo runs on sample data saved in your browser. It includes no live bank connection, real payment link, email delivery or course access. Use Reset demo before another presentation to restore the original examples.</span></div>`}
function openModal(title,subtitle,body,footer='',wide=false){lastFocus=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle" class="modal ${wide?'wide':''}"><header class="modal-head"><div><h2 id="modal-title">${title}</h2><p id="modal-subtitle">${subtitle}</p></div><button class="icon-btn" aria-label="Close dialog" onclick="closeModal()">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal select,.modal button')?.focus(),0)}
function closeModal(){document.querySelector('#modal-root').innerHTML='';document.body.style.overflow='';lastFocus?.isConnected&&lastFocus.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.modal'))closeModal();else if(isPresentation)presentation();else document.body.classList.remove('nav-open')}if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled):not([type="hidden"]),.modal select,.modal textarea,.modal a[href]')].filter(el=>el.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function registrationForm(id=null,preselected=null){const r=state.registrations.find(r=>r.id===id);openModal(r?'Edit registration':'New registration',r?'Update participant and booking details.':'Add an individual, institution or sponsored booking.',`<form id="registration-form" onsubmit="submitRegistration(event,'${id||''}')"><div class="form-grid"><label class="field"><span>Full name *</span><input name="name" required maxlength="80" autocomplete="off" value="${esc(r?.name||'')}" placeholder="Participant or contact name"></label><label class="field"><span>Email address *</span><input name="email" type="email" required maxlength="120" value="${esc(r?.email||'')}" placeholder="name@example.com"></label><label class="field"><span>Phone number</span><input name="phone" maxlength="30" value="${esc(r?.phone||'')}" placeholder="+961..."></label><label class="field"><span>Booking type</span><select name="type" aria-label="Booking type">${['Individual','Institution','Donor'].map(t=>`<option ${r?.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field full-width"><span>Organization (optional)</span><input name="organization" maxlength="100" value="${esc(r?.organization||'')}" placeholder="Institution or donor group"></label><label class="field full-width"><span>Course *</span><select name="courseId" aria-label="Course" required onchange="updateFormTotal()">${state.courses.map(c=>`<option value="${c.id}" ${(r?.courseId||preselected)===c.id?'selected':''}>${esc(c.title)} · ${money(c.price)}</option>`).join('')}</select></label><label class="field"><span>Number of seats *</span><input type="number" name="seats" min="1" max="100" required value="${r?.seats||1}" oninput="updateFormTotal()"></label><label class="field"><span>Payment status</span><select name="status" aria-label="Payment status">${['unpaid','review','paid','cancelled'].map(s=>`<option value="${s}" ${r?.status===s?'selected':''}>${statusText[s]}</option>`).join('')}</select></label><label class="field full-width"><span>Notes</span><textarea name="notes" maxlength="500" placeholder="Requests, participant details or internal notes...">${esc(r?.notes||'')}</textarea></label></div><div class="form-total"><span>Total course fees</span><b id="form-total">${money((course(r?.courseId||preselected||state.courses[0]?.id)?.price||0)*(r?.seats||1))}</b></div></form>`,`<button onclick="closeModal()">Cancel</button><button type="submit" form="registration-form" class="primary">${icon('check','sm')}${r?'Save changes':'Create registration'}</button>`)}
function updateFormTotal(){const f=document.querySelector('#registration-form');document.querySelector('#form-total').textContent=money((course(f.elements.courseId.value)?.price||0)*Number(f.elements.seats.value||0))}
function submitRegistration(e,id){e.preventDefault();const data=Object.fromEntries(new FormData(e.target)),c=course(data.courseId),old=state.registrations.find(r=>r.id===id);data.seats=Number(data.seats);if(data.status!=='cancelled'&&booked(c.id)-(old&&old.courseId===c.id&&old.status!=='cancelled'?old.seats:0)+data.seats>c.capacity){toast('This booking exceeds the available seats. Choose fewer seats.','info');return}if(old)Object.assign(old,data,{receipt:data.status==='unpaid'?null:old.receipt||'sample'});else{const next=Math.max(1048,...state.registrations.map(r=>Number(r.id.slice(4))))+1;state.registrations.unshift({...data,id:'REG-'+next,created:'2026-10-24',receipt:data.status==='unpaid'?null:'sample'})}activity(old?'Registration details were updated':'A new registration was added','users');save();closeModal();render();toast(old?'Registration updated':'Registration created');if(!old)registrationDetails(state.registrations[0].id)}
function registrationDetails(id){const r=state.registrations.find(r=>r.id===id),c=course(r.courseId);openModal('Registration details',`${esc(r.id)} · Booked ${date(r.created)}`,`<div class="detail-heading"><div class="avatar">${esc(r.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</div><div><h3>${esc(r.name)}</h3><p>${esc(r.type)}${r.organization?' · '+esc(r.organization):''}</p></div><div style="margin-left:auto">${statusTag(r.status)}</div></div><div class="detail-grid"><div><span>Email</span><strong>${esc(r.email)}</strong></div><div><span>Phone</span><strong>${esc(r.phone||'Not provided')}</strong></div><div><span>Course</span><strong>${esc(c?.title)}</strong></div><div><span>Session</span><strong>${c?date(c.date)+' · '+c.time:'—'}</strong></div><div><span>Seats</span><strong>${r.seats} participant${r.seats===1?'':'s'}</strong></div><div><span>Total fees</span><strong>${money(total(r))}</strong></div></div>${r.notes?`<div class="detail-section"><h3>Notes</h3><p>${esc(r.notes)}</p></div>`:''}<div class="detail-section"><h3>${c?.mode==='Online'?'Online course access':'Training attendance'}</h3><p>${r.status==='paid'?(c?.mode==='Online'?'Payment confirmed. A live system can release the course or meeting link to the registered participant.':'Payment confirmed. This participant is ready for attendance check-in.'):'Course access and confirmation remain pending until payment is verified.'}</p></div><div class="detail-actions">${r.status==='review'?`<button class="primary" onclick="reviewPayment('${id}')">${icon('file','sm')}Review payment</button>`:r.status!=='cancelled'?`<button onclick="paymentPreview('${id}')">${icon('link','sm')}Preview payment page</button>`:''}<button onclick="registrationForm('${id}')">${icon('edit','sm')}Edit details</button></div>`,`<button onclick="closeModal()">Close</button>`)}
function courseForm(id=null){const c=course(id);openModal(c?'Edit course':'Create a course',c?'Keep the course details clear and up to date.':'Build a new training opportunity for your audience.',`<form id="course-form" onsubmit="submitCourse(event,'${id||''}')"><div class="form-grid"><label class="field full-width"><span>Course title *</span><input name="title" required maxlength="90" value="${esc(c?.title||'')}" placeholder="e.g. Communication & Teamwork"></label><label class="field full-width"><span>Description *</span><textarea name="description" required maxlength="350">${esc(c?.description||'')}</textarea></label><label class="field"><span>Category</span><input name="category" required maxlength="40" value="${esc(c?.category||'Professional development')}"></label><label class="field"><span>Delivery mode</span><select name="mode" aria-label="Delivery mode"><option ${c?.mode==='In person'?'selected':''}>In person</option><option ${c?.mode==='Online'?'selected':''}>Online</option></select></label><label class="field"><span>Date *</span><input type="date" name="date" required value="${c?.date||'2026-11-12'}"></label><label class="field"><span>Start time *</span><input type="time" name="time" required value="${c?.time||'10:00'}"></label><label class="field"><span>Duration</span><input name="duration" required maxlength="30" value="${esc(c?.duration||'2 hours')}"></label><label class="field"><span>Venue or platform</span><input name="location" required maxlength="80" value="${esc(c?.location||'Training room A')}"></label><label class="field"><span>Price per seat (USD) *</span><input type="number" name="price" required min="0" max="100000" step="0.01" value="${c?.price??100}"></label><label class="field"><span>Seat capacity *</span><input type="number" name="capacity" required min="1" max="10000" value="${c?.capacity||20}"></label><label class="checkbox-line full-width"><input type="checkbox" name="published" ${c?.published?'checked':''}>Publish this course on the sample website</label></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" form="course-form" type="submit">${icon('check','sm')}${c?'Save changes':'Create course'}</button>`)}
function submitCourse(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.price=Number(d.price);d.capacity=Number(d.capacity);d.published=!!d.published;if(id&&d.capacity<booked(id)){toast('Capacity cannot be lower than the seats already reserved.','info');return}if(id&&state.registrations.some(r=>r.courseId===id)&&course(id).price!==d.price){toast('This course has bookings. Keep its current price and create another course for a new fee.','info');return}if(id)Object.assign(course(id),d);else state.courses.push({...d,id:'c'+Date.now(),icon:'book'});activity(id?'A course was updated':'A new course was created','book');save();closeModal();render();toast(id?'Course updated':'Course created')}
function courseDetails(id){const c=course(id),regs=state.registrations.filter(r=>r.courseId===id&&r.status!=='cancelled');openModal(esc(c.title),`${esc(c.category)} · ${c.published?'Published on website':'Draft course'}`,`<div class="detail-grid"><div><span>Session</span><strong>${date(c.date)} · ${c.time}</strong></div><div><span>Duration</span><strong>${esc(c.duration)}</strong></div><div><span>Delivery</span><strong>${esc(c.mode)} · ${esc(c.location)}</strong></div><div><span>Course fee</span><strong>${money(c.price)} per seat</strong></div></div><p class="subtle small">${esc(c.description)}</p><div class="course-seats">${booked(id)} of ${c.capacity} seats reserved<div class="progress-track"><span style="width:${Math.min(100,booked(id)/c.capacity*100)}%"></span></div></div><div class="detail-section"><h3>Registered participants</h3>${regs.map(r=>`<div class="settings-row" style="padding:9px 0"><div><strong style="font-size:11px">${esc(r.name)}</strong><p>${r.seats} seat${r.seats===1?'':'s'} · ${esc(r.type)}</p></div>${statusTag(r.status)}</div>`).join('')||'<p>No registrations yet.</p>'}</div>`,`<button onclick="courseForm('${id}')">${icon('edit','sm')}Edit course</button><button onclick="toggleCourse('${id}')">${c.published?'Unpublish':'Publish course'}</button><button class="primary" onclick="registrationForm(null,'${id}')">${icon('plus','sm')}Add booking</button>`)}
function toggleCourse(id){const c=course(id);c.published=!c.published;activity(c.published?'A course was published to the website':'A course was moved to draft','book');save();closeModal();render();toast(c.published?'Course published in website preview':'Course unpublished')}
function reviewPayment(id){const r=state.registrations.find(r=>r.id===id);openModal(r.status==='paid'?'Payment receipt':'Review bank payment',`${esc(r.name)} · ${esc(r.id)}`,`<div class="receipt-paper"><header><strong>BANK TRANSFER</strong><span class="tag ${r.status==='paid'?'green':'orange'}">${r.status==='paid'?'Confirmed':'To verify'}</span></header><dl><dt>Payment reference</dt><dd>PAY-${r.id.slice(4)}</dd><dt>Participant</dt><dd>${esc(r.name)}</dd><dt>Course</dt><dd>${esc(course(r.courseId)?.title)}</dd><dt>Transfer date</dt><dd>${date(r.created)}</dd><dt>Amount</dt><dd><strong>${money(total(r))}</strong></dd><dt>Method</dt><dd>Bank transfer</dd></dl><footer>SAMPLE RECEIPT · DEMONSTRATION ONLY</footer></div><div class="inline-note">${icon('info')}<span>This is a sample receipt. In the live system, a manager checks the bank account before confirming payment.</span></div>${r.status!=='paid'?`<label class="checkbox-line"><input id="verify-checkbox" type="checkbox" onchange="document.querySelector('#approve-payment').disabled=!this.checked">Simulate verifying that this bank transfer was received.</label>`:''}`,`<button onclick="closeModal()">Close</button>${r.status!=='paid'?`<button id="approve-payment" disabled class="primary" onclick="approvePayment('${id}')">${icon('check','sm')}Confirm payment</button>`:''}`)}
function approvePayment(id){const r=state.registrations.find(r=>r.id===id);r.status='paid';activity('A bank payment was confirmed','wallet');save();closeModal();render();toast('Payment confirmed. Registration is now paid.')}
function paymentPreview(id){const r=state.registrations.find(r=>r.id===id),c=course(r.courseId);openModal('Participant payment page','Preview of the step after a course booking.',`<div class="booking-steps"><span>1. Booking</span><i></i><b>2. Payment</b><i></i><span>3. Confirmation</span></div><div class="payment-amount"><small>${esc(c?.title)}</small><strong>${money(total(r))}</strong><small>${r.seats} seat${r.seats===1?'':'s'} · ${esc(r.name)}</small></div><div class="payment-reference"><span>Booking reference: <b>${esc(r.id)}</b></span><button onclick="copyText('${r.id}')">${icon('copy','sm')}Copy</button></div><div class="payment-method">${icon('bank')}<div><strong>Pay by bank transfer</strong><small>Include your booking reference with the transfer.</small></div></div><div class="pay-empty">In the finished system, the association’s approved bank instructions or secure payment provider link appears here.<br><strong>Demo only · no real bank details or payment processing.</strong></div>${r.status==='paid'?'<div class="inline-note" style="margin-top:17px;color:var(--green);background:var(--green-bg);border-color:#cfe8da">'+icon('check')+'This booking is already marked as paid.</div>':`<div class="detail-section"><h3>Already made your transfer?</h3><p>A participant can submit proof of payment for the manager to review.</p><button style="margin-top:13px" onclick="simulateReceipt('${id}')">${icon('upload','sm')}Submit sample receipt</button></div>`}`,`<button onclick="closeModal()">Close preview</button>`)}
function simulateReceipt(id){const r=state.registrations.find(r=>r.id===id);r.status='review';r.receipt='sample';activity('A participant submitted proof of payment','file');save();closeModal();render();toast('Sample receipt submitted. It is now awaiting manager review.')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Reference copied')}catch{toast('Booking reference: '+t,'info')}}
function uploadForm(){openModal('Upload photos','Publish images to the sample website gallery.',`<form id="photo-form" onsubmit="submitPhotos(event)"><label class="drop-area" for="photo-files">${icon('image')}<strong>Choose photos from your device</strong><small>JPG, PNG or WebP · maximum 8 MB each · up to 6 at once</small><input id="photo-files" class="sr-only" type="file" name="files" accept="image/jpeg,image/png,image/webp" multiple required onchange="photoFilesChanged(this)"></label><div id="file-previews"></div><div class="form-grid" style="margin-top:22px"><label class="field full-width"><span>Photo title (optional)</span><input name="title" maxlength="80" placeholder="e.g. Leadership workshop highlights"></label><label class="field full-width"><span>Category</span><select name="category" aria-label="Photo category"><option>Training & workshops</option><option>Events</option><option>Our work</option><option>Team</option></select></label><label class="checkbox-line full-width"><input name="published" type="checkbox" checked>Publish in the sample website gallery</label></div></form>`,`<button onclick="closeModal()">Cancel</button><button id="upload-photos" class="primary" form="photo-form" type="submit">${icon('upload','sm')}Upload photos</button>`)}
function photoFilesChanged(input){document.querySelector('#file-previews').innerHTML=[...input.files].slice(0,6).map(f=>`<div class="file-preview">${icon('image','sm')}${esc(f.name)} · ${(f.size/1048576).toFixed(1)} MB</div>`).join('')}
function compressPhoto(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=()=>reject(new Error('Unable to read image.'));fr.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('This image could not be opened.'));img.onload=()=>{const ratio=Math.min(1,1200/img.width,1200/img.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=fr.result};fr.readAsDataURL(file)})}
async function submitPhotos(e){e.preventDefault();const f=e.target,files=[...f.elements.files.files];if(files.length>6){toast('Choose up to 6 photos at a time.','info');return}if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8*1048576)){toast('Choose JPG, PNG or WebP images smaller than 8 MB.','info');return}const btn=document.querySelector('#upload-photos');btn.disabled=true;btn.textContent='Preparing photos...';try{const photos=await Promise.all(files.map(async(file,i)=>({id:'photo'+Date.now()+'-'+i,url:await compressPhoto(file),title:f.elements.title.value.trim()?(files.length>1?f.elements.title.value.trim()+' '+(i+1):f.elements.title.value.trim()):file.name.replace(/\.[^.]+$/,''),category:f.elements.category.value,published:f.elements.published.checked})));state.photos.unshift(...photos);activity(photos.length+' photo'+(photos.length===1?' was':'s were')+' added to the gallery','image');const persisted=save();closeModal();render();toast(photos.length+' photo'+(photos.length===1?'':'s')+' added'+(persisted?' and saved':''))}catch(err){btn.disabled=false;btn.textContent='Upload photos';toast(err.message||'The image could not be added. Try a different file.','info')}}
function togglePhoto(id){const p=state.photos.find(p=>p.id===id);p.published=!p.published;activity(p.published?'A photo was published to the website':'A photo was unpublished','image');save();render();toast(p.published?'Photo published. Open Website preview to see it.':'Photo removed from the website preview')}
function deletePhoto(id){const p=state.photos.find(p=>p.id===id);openModal('Remove photo?','This removes the photo from this demo and its website preview.',`<p class="subtle">${esc(p.title)}</p>`,`<button onclick="closeModal()">Keep photo</button><button class="danger" onclick="state.photos=state.photos.filter(p=>p.id!=='${id}');save();closeModal();render();toast('Photo removed')">${icon('trash','sm')}Remove photo</button>`)}
function projectForm(id=null){const p=state.projects.find(p=>p.id===id);openModal(p?'Edit project':'Add a portfolio project','Published projects appear in the website preview.',`<form id="project-form" onsubmit="submitProject(event,'${id||''}')"><div class="form-grid"><label class="field full-width"><span>Project title *</span><input name="title" required maxlength="90" value="${esc(p?.title||'')}"></label><label class="field"><span>Category *</span><input name="category" required maxlength="50" value="${esc(p?.category||'Capacity building')}"></label><label class="field"><span>Year *</span><input name="year" type="number" required min="2000" max="2100" value="${esc(p?.year||'2026')}"></label><label class="field full-width"><span>Description *</span><textarea name="description" required maxlength="500">${esc(p?.description||'')}</textarea></label><label class="checkbox-line full-width"><input name="published" type="checkbox" ${p?.published?'checked':''}>Publish on sample website</label></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="project-form">Save project</button>`)}
function submitProject(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=!!d.published;if(id)Object.assign(state.projects.find(p=>p.id===id),d);else state.projects.push({...d,id:'p'+Date.now()});activity('A portfolio project was updated','briefcase');save();closeModal();render();toast('Portfolio saved')}
function partnerForm(id=null){const p=state.partners.find(p=>p.id===id);openModal(p?'Edit partner':'Add a partner','Keep institution and donor contact details together.',`<form id="partner-form" onsubmit="submitPartner(event,'${id||''}')"><div class="form-grid"><label class="field full-width"><span>Organization name *</span><input name="name" required maxlength="100" value="${esc(p?.name||'')}"></label><label class="field"><span>Type</span><select name="type" aria-label="Partner type"><option ${p?.type==='Institution'?'selected':''}>Institution</option><option ${p?.type==='Donor'?'selected':''}>Donor</option></select></label><label class="field"><span>Contact person *</span><input name="contact" required maxlength="80" value="${esc(p?.contact||'')}"></label><label class="field full-width"><span>Email *</span><input type="email" name="email" required maxlength="120" value="${esc(p?.email||'')}"></label><label class="field full-width"><span>Relationship notes</span><textarea name="notes" maxlength="300">${esc(p?.notes||'')}</textarea></label></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="partner-form">Save partner</button>`)}
function submitPartner(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(id)Object.assign(state.partners.find(p=>p.id===id),d);else state.partners.push({...d,id:'o'+Date.now(),status:'Active'});save();closeModal();render();toast('Partner saved')}
function websitePreview(section){openModal('Website preview','Changes to courses, portfolio and published photos appear here.',`<div class="website-preview"><div class="preview-top"><nav aria-label="Sample website navigation"><a href="#preview-training" onclick="event.preventDefault();document.querySelector('#preview-training').scrollIntoView({behavior:'smooth'})">Training</a><a href="#preview-work" onclick="event.preventDefault();document.querySelector('#preview-work').scrollIntoView({behavior:'smooth'})">Our work</a><a href="#preview-gallery" onclick="event.preventDefault();document.querySelector('#preview-gallery').scrollIntoView({behavior:'smooth'})">Gallery</a></nav><span class="tag green" style="font-size:8px">WEBSITE DEMO</span></div><div class="preview-hero"><small>LEARN. CONNECT. MAKE AN IMPACT.</small><h2>Better skills.<br>Stronger communities.</h2><p>Practical training that brings individuals, institutions and partners together to build what comes next.</p><button onclick="document.querySelector('#preview-training').scrollIntoView({behavior:'smooth'})">Explore training ${icon('arrow','sm')}</button></div><section class="preview-section" id="preview-training"><h3>Upcoming training</h3><div class="preview-courses">${state.courses.filter(c=>c.published).map((c,i)=>`<article class="preview-course"><div class="course-art art${i%4}"><span>${esc(c.category)}</span>${icon(c.icon)}</div><div class="preview-course-body"><h4>${esc(c.title)}</h4><p>${shortDate(c.date)} · ${esc(c.mode)}</p><footer><strong>${state.settings.showPrices?money(c.price):'Learn more'}</strong><button ${!state.settings.openBookings||booked(c.id)>=c.capacity?'disabled':''} onclick="publicBooking('${c.id}')">${booked(c.id)>=c.capacity?'Fully booked':state.settings.openBookings?'Register':'Closed'} ${icon('chevron','sm')}</button></footer></div></article>`).join('')||'<div class="preview-placeholder">No published courses yet.</div>'}</div></section><section class="preview-section" id="preview-work"><h3>Our work</h3>${state.projects.filter(p=>p.published).map(p=>`<div class="preview-project"><strong>${esc(p.title)}</strong><p>${esc(p.description)}</p></div>`).join('')||'<div class="preview-placeholder">No published projects yet.</div>'}</section><section class="preview-section" id="preview-gallery"><h3>Moments that matter</h3>${state.photos.some(p=>p.published)?`<div class="preview-photos">${state.photos.filter(p=>p.published).map(p=>`<figure style="margin:0"><img src="${p.url}" alt="${esc(p.title)}"><figcaption style="font-size:9px;margin-top:6px;color:#8c9e8b">${esc(p.title)}</figcaption></figure>`).join('')}</div>`:'<div class="preview-placeholder">Published photos will appear here.<br>Upload a photo in the manager to demonstrate the update.</div>'}</section><div class="preview-tagline">Unbranded website preview · Sample content</div></div>`,`<button onclick="closeModal()">Back to manager</button>`,true);if(section==='gallery')setTimeout(()=>document.querySelector('#preview-gallery')?.scrollIntoView({behavior:'smooth'}),120)}
function publicBooking(id){const c=course(id);openModal('Register for training',esc(c.title),`<div class="booking-steps"><b>1. Booking</b><i></i><span>2. Payment</span><i></i><span>3. Confirmation</span></div><div class="inline-note">${icon('calendar')}<span>${date(c.date)} · ${c.time} · ${esc(c.mode)} · ${money(c.price)} per seat</span></div><form id="public-booking" onsubmit="submitPublicBooking(event,'${id}')"><div class="form-grid"><label class="field"><span>Full name *</span><input name="name" required maxlength="80" placeholder="Your full name"></label><label class="field"><span>Email *</span><input name="email" type="email" required maxlength="120" placeholder="you@example.com"></label><label class="field"><span>Booking type</span><select name="type" aria-label="Booking type"><option>Individual</option><option>Institution</option><option>Donor</option></select></label><label class="field"><span>Seats *</span><input type="number" name="seats" min="1" max="${Math.max(1,c.capacity-booked(id))}" value="1" required oninput="document.querySelector('#booking-total').textContent=money(Number(this.value)*${c.price})"></label><label class="field full-width"><span>Organization (optional)</span><input name="organization" maxlength="100"></label></div><div class="form-total"><span>Total course fees</span><b id="booking-total">${money(c.price)}</b></div></form>`,`<button onclick="websitePreview()">Back</button><button class="primary" type="submit" form="public-booking">Continue to payment ${icon('chevron','sm')}</button>`)}
function submitPublicBooking(e,id){e.preventDefault();if(!state.settings.openBookings||!course(id)?.published){toast('This course is not accepting registrations.','info');return}const d=Object.fromEntries(new FormData(e.target));d.seats=Number(d.seats);if(booked(id)+d.seats>course(id).capacity){toast('There are not enough seats available.','info');return}const next=Math.max(1048,...state.registrations.map(r=>Number(r.id.slice(4))))+1;const r={...d,id:'REG-'+next,courseId:id,created:'2026-10-24',status:'unpaid',receipt:null,phone:'',notes:'Added through sample website booking.'};state.registrations.unshift(r);activity('A website registration was received','globe');save();render();toast('Website booking added to the manager');paymentPreview(r.id)}
function notifications(){openModal('Recent activity','The latest changes in your demo workspace.',`<div class="activity-list" style="padding:0">${state.activities.map(activityRow).join('')}</div>`,`<button onclick="closeModal()">Close</button>`)}
function presentation(){isPresentation=!isPresentation;document.body.classList.toggle('presentation',isPresentation);closeModal();render();window.scrollTo(0,0)}
function resetPrompt(){openModal('Reset the demo?','Restore the original sample data for your next presentation.',`<p class="subtle small">Registrations, courses, payments and settings will return to their starting state. Photos and other items added to this demo will be removed.</p>`,`<button onclick="closeModal()">Keep exploring</button><button class="primary" onclick="state=seed();save();closeModal();go('overview');toast('Demo restored to its original sample data')">${icon('refresh','sm')}Reset demo</button>`)}
function csvFile(name,headers,rows){const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const text='\uFEFF'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV export downloaded')}
function exportRegistrations(){csvFile('registrations-demo.csv',['Reference','Name','Email','Phone','Type','Organization','Course','Seats','Amount USD','Payment status','Booked on'],filteredRegs().map(r=>[r.id,r.name,r.email,r.phone,r.type,r.organization,course(r.courseId)?.title,r.seats,total(r),statusText[r.status],r.created]))}
function exportPayments(){csvFile('payments-demo.csv',['Payment reference','Registration','Participant','Course','Amount USD','Status'],state.registrations.filter(r=>r.status!=='cancelled').map(r=>['PAY-'+r.id.slice(4),r.id,r.name,course(r.courseId)?.title,total(r),statusText[r.status]]))}
function exportReport(){csvFile('course-performance-demo.csv',['Course','Date','Mode','Capacity','Seats reserved','Confirmed revenue USD','Published'],state.courses.map(c=>[c.title,c.date,c.mode,c.capacity,booked(c.id),state.registrations.filter(r=>r.courseId===c.id&&r.status==='paid').reduce((s,r)=>s+total(r),0),c.published?'Yes':'No']))}
render();
</script>
